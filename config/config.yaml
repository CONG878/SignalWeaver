# SignalWeaver 프로젝트 공통 설정
project:
  name: "SignalWeaver"
  reference_date: "20260323"

# 01_collect_data: 데이터 수집 설정
data_collection:
  start_date: "20230725"
  end_date: "20260323"
  save_csv: True
  save_parquet: True
  min_sleep: 0.05
  max_sleep: 0.8

# 02_build_dataset: 피처 엔지니어링 및 전처리 설정
preprocessing:
  min_history: 60             # 최소 상장 기간 (거래일 기준)
  technical_windows: [5, 60]  # 이동평균 및 이격도 계산 윈도우
  volume_window: 20           # 거래량 비율 계산 윈도우
  rsi_period: 14              # RSI 계산 기간
  save_csv: True              # 디버깅용 개별 종목 CSV 저장 여부
  save_parquet: True          # 통합 학습 데이터셋 저장 여부

# 03_train_predict: 모델 학습 및 검증 설정
training:
  # 검증 폴드 훈련 종료일 (테스트 폴드는 이로부터 valid_window_days 이후까지 학습)
  train_end: "2025-10-30"

  # Embargo Gap: 타겟 시차로 인한 데이터 누수(Look-ahead bias)를 방지하기 위해 
  # max(horizons)만큼의 간격을 훈련과 검증/테스트 사이에 자동으로 적용합니다.
  
  valid_window_days: 45       # 검증 윈도우 크기 및 훈련 구간 롤링 오프셋
  test_window_days: 45        # 최종 테스트 윈도우 크기

  # 타겟 설정
  # - log_close: 절대 가격 log(close) 예측
  # - log_return_1d: 당일 등락률 log1p(change_pct) 예측 (v3.9.1 사다리꼴 보정 적용)
  target_col_name: "target_log_return_1d"
  target_type: "log_return_1d" 

  horizons: [1, 2, 3, 4, 5]   # 예측 대상 시차 (영업일 기준)

  # [모델별 하이퍼파라미터]
  lgbm_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    random_state: 42
    n_jobs: -1
    verbose: -1

  randomforest_params:
    n_estimators: 40
    max_depth: 16
    min_samples_split: 80
    min_samples_leaf: 40
    n_jobs: -1
    random_state: 42
    max_samples: 0.5

  mlp_params:
    hidden_dims: [64, 32, 16]
    dropout_rates: [0.2, 0.0, 0.0]
    learning_rate: 0.001
    batch_size: 512
    epochs: 200
    patience: 15
    weight_decay: 0.0001

# 05_universe_selection: 투자 유니버스 선정 및 전략 설정
universe:
  model_date: "20260322"    # 정확도 평가의 기준이 되는 모델 학습일

strategy:
  min_hold_days: 5            # 최소 보유 기간 필터
  # 비현실적 수익률 상한: 일평균 수익률이 해당 값을 초과하는 비정상적 급등주는 후보에서 제외합니다.
  max_daily_return: 0.16      
  top_k: 200                  # 최종 추천 종목 수

# 활성화 모델 설정 (단일: lgbm, rf, mlp / 앙상블: lgbm+rf 등 조합 가능)
active_model: "mlp+lgbm"

# 경로 설정
paths:
  raw_dir: "data/01_raw"
  processed_dir: "data/02_processed"
  training_dir: "data/03_training"
  forecasts_dir: "data/04_forecasts"
  universe_dir: "data/05_universe"
  model_dir: "data/03_training"
  meta_dir: "data/99_meta"

# 캘린더 설정
calendar:
  start_date: "2026-03-24"
  end_date: "2026-05-27"
  prefer_mcal: True
