# SignalWeaver 프로젝트 공통 설정
project:
  name: "SignalWeaver"
  reference_date: "20260206"

# 01_collect_data 관련 설정
data_collection:
  start_date: "20221107"
  end_date: "20260206"
  save_csv: True
  save_parquet: True
  min_sleep: 0.05
  max_sleep: 0.8

# 02_build_dataset 관련 설정
preprocessing:
  min_history: 60
  technical_windows: [5, 20, 60]
  volume_window: 20
  rsi_period: 14
  save_csv: True
  save_parquet: True

# 03_train_predict 관련 설정 (Multi-Horizon Update)
training:
  train_end: "2025-02-14"
  
  # Multi-horizon 설정
  valid_window_days: 60
  test_window_days: 60
  num_valid: 3       # Walk-forward 검증 횟수
  target_col_name: "target_log_close"
  
  # 예측하고자 하는 시차(영업일) 리스트
  horizons: [1, 2, 3, 4, 5]
  
  # MultiOutputRegressor용 파라미터
  lgbm_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    random_state: 42
    n_jobs: -1       # 병렬 처리
    verbose: -1      # 로그 끄기

# 05_universe_selection 관련설정
universe:
  model_date: "20260206"

# 📂 경로 설정 (H1 패치: 단계별 분리)
paths:
  # 기본 경로
  raw_dir: "data/01_raw"
  processed_dir: "data/02_processed"
  
  # ✨ H1 패치: 단계별 독립 경로
  training_dir: "data/03_training"      # Step 3: 학습 검증 예측
  forecasts_dir: "data/04_forecasts"    # Step 4: 미래 예측
  universe_dir: "data/05_universe"      # Step 5: 최종 선정
  
  # 모델 저장 (Step 3과 연관)
  model_dir: "data/03_training"         # 학습 단계와 동일 위치
  
  # 메타 데이터
  meta_dir: "data/99_meta"
  
  # 🔄 하위 호환성 (deprecated, 향후 제거 예정)
  result_dir: "data/03_training"        # 기존 코드 호환용

# 캘린더 설정
calendar:
  # 시작일과 종료일을 구체적으로 지정 (save_trading_days의 방식 반영)
  start_date: "2026-02-09"
  end_date: "2026-05-11"
  
  # pandas_market_calendars 사용 여부 설정
  prefer_mcal: True
