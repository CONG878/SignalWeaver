# SignalWeaver 프로젝트 공통 설정 — v4.1.0
project:
  name: "SignalWeaver"
  reference_date: "20260417"    # 데이터 수집 기준일. 실행마다 갱신 가능.

# 01_collect_data
data_collection:
  start_date: "20240619"
  end_date: "20260417"
  save_csv: True
  save_parquet: True
  min_sleep: 0.05
  max_sleep: 0.8

# 02_build_dataset
preprocessing:
  min_history: 60
  technical_windows: [5, 60]
  volume_window: 20
  rsi_period: 14
  save_csv: True
  save_parquet: True

# 03a_train_tabular — Tabular 트랙 학습 설정
training:
  train_end: "2026-01-19"

  valid_window_days: 20
  test_window_days: 20

  # target_type: "log_close" | "log_return_1d"
  target_col_name: "target_log_return_1d"
  target_type: "log_return_1d"

  horizons: [1, 2, 3, 4, 5]

  lgbm_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    random_state: 42
    n_jobs: -1
    verbose: -1

  randomforest_params:
    n_estimators: 40
    max_depth: 16
    min_samples_split: 80
    min_samples_leaf: 40
    n_jobs: -1
    random_state: 42
    max_samples: 0.5

  mlp_params:
    hidden_dims: [64, 32, 16]
    dropout_rates: [0.2, 0.0, 0.0]
    learning_rate: 0.001
    batch_size: 512
    epochs: 200
    patience: 15
    weight_decay: 0.0001

# ── v4.0.0 신규: 03c_train_seq — Seq 트랙 설정 ──────────────────
sequence:
  seq_len: 30
  forecast_horizon: 20
  stride: 5
  target_type: "log_return_1d"

# ── v4.0.0 신규: GRU 하이퍼파라미터 ────────────────────────────
gru_params:
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 256
  epochs: 100
  patience: 10
  bidirectional: false

# ── v4.1.0 신규: 수치 적분 차수 ────────────────────────────────
# target_type=log_return_1d 모드에서 log-close 역산 시 사용.
# 0 — 직사각형 (v3.9.0): 보정 없음, 가장 빠름
# 1 — 사다리꼴  (v3.9.1): 선형 보간, 기본값
# 2 — Adams-Moulton 2-step (v4.1.0): 2차 보간, 가장 정확
#     order=2는 02단계에서 target_log_return_1d_lag1 컬럼이 생성되어야 함.
integration_order: 2

# 05_universe_selection
universe:
  model_date: "20260417"

strategy:
  min_hold_days: 5
  max_daily_return: 0.16
  top_k: 200

# 활성화 모델
active_model: "gru"
active_seq_model: "gru"

paths:
  raw_dir: "data/01_raw"
  processed_dir: "data/02_processed"
  training_dir: "data/03_training"
  seq_dir: "data/03_seq"
  forecasts_dir: "data/04_forecasts"
  universe_dir: "data/05_universe"
  prep_dir: "data/00_prep"

calendar:
  start_date:   "2021-01-02"
  end_date:     "2028-12-30"
  forecast_end: "2026-05-19"
  prefer_mcal: True

debug:
  save_raw_predictions: false
