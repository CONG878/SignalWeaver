# SignalWeaver 프로젝트 공통 설정
project:
  name: "SignalWeaver"
  reference_date: "20260220"

# 01_collect_data 관련 설정
data_collection:
  start_date: "20230512"
  end_date: "20260220"
  save_csv: True
  save_parquet: True
  min_sleep: 0.05
  max_sleep: 0.8

# 02_build_dataset 관련 설정
preprocessing:
  min_history: 60
  technical_windows: [5, 60]
  volume_window: 20
  rsi_period: 14
  save_csv: True
  save_parquet: True

# 03_train_predict 관련 설정 (v3.5.0: 2-Fold + log_return 타겟)
training:
  # 검증 폴드 훈련 종료일
  # 테스트 폴드 훈련 종료일 = train_end + valid_window_days 거래일
  train_end: "2025-08-13"

  # 검증 윈도우 크기 (거래일)
  # 동시에 테스트 폴드의 훈련 구간 롤링 offset으로 사용됨
  valid_window_days: 60

  # 테스트 윈도우 크기 (거래일)
  # 엄밀히 valid_window_days와 다를 수 있으나 보통 동일하게 설정
  test_window_days: 60

  # 02단계에서 생성된 기준 타겟 컬럼 (log_close 값을 담고 있어야 함)
  target_col_name: "target_log_close"

  # 타겟 타입
  # "log_return": target_log_return_h{n} = log_close(t+n) - log_close(t)  [권장]
  # "log_close" : target_log_close_h{n}  = log_close(t+n)                [레거시]
  target_type: "log_close"

  # 예측하고자 하는 시차(영업일) 리스트
  horizons: [1, 2, 3, 4, 5]

  # LightGBM용 파라미터
  lgbm_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    random_state: 42
    n_jobs: -1
    verbose: -1

  # RandomForest 전용 파라미터
  randomforest_params:
    n_estimators: 40
    max_depth: 8
    min_samples_split: 10
    min_samples_leaf: 5
    n_jobs: -1
    random_state: 42
    max_samples: 0.6

# 05_universe_selection 관련설정
universe:
  model_date: "20260220"

# 모델 선택: 'lightgbm', 'randomforest' or 'ensemble'
active_model: "lightgbm"

# 📂 경로 설정
paths:
  raw_dir: "data/01_raw"
  processed_dir: "data/02_processed"
  training_dir: "data/03_training"
  forecasts_dir: "data/04_forecasts"
  universe_dir: "data/05_universe"
  model_dir: "data/03_training"
  meta_dir: "data/99_meta"

# 캘린더 설정
calendar:
  start_date: "2026-02-23"
  end_date: "2026-05-20"
  prefer_mcal: True
